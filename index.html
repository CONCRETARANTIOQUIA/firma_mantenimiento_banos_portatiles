<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Firmar registro de mantenimiento</title>
  <style>
    :root {
      --tinta: #14181c;
      --papel: #f7f5f1;
      --linea: #c9c4bb;
      --acento: #c94a2a;
      --alerta: #a4402c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--papel);
      color: var(--tinta);
      -webkit-text-size-adjust: 100%;
    }
    .caja { max-width: 480px; margin: 0 auto; }

    .encabezado { text-align: center; margin-bottom: 22px; }
    .logo {
      display: block;
      width: 100%;
      max-width: 200px;
      height: auto;
      margin: 0 auto 12px;
    }
    .subtitulo {
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #6b665e; margin: 0;
    }

    h1 { font-size: 20px; margin: 16px 0 8px; font-weight: 700; }
    p.ayuda { font-size: 14px; line-height: 1.5; color: #4a4740; margin: 0 0 18px; }

    .lienzo {
      position: relative; background: #fff;
      border: 1px solid var(--linea); border-radius: 6px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 180px; touch-action: none; cursor: crosshair; }
    .renglon {
      position: absolute; left: 24px; right: 24px; bottom: 42px;
      border-bottom: 1px dashed var(--linea); pointer-events: none;
    }
    .pie {
      position: absolute; left: 24px; bottom: 20px;
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      color: #9a958c; pointer-events: none;
    }

    .botones { display: flex; gap: 10px; margin-top: 16px; }
    button {
      flex: 1; padding: 15px 12px; font-size: 15px; font-weight: 600;
      border-radius: 6px; border: 1px solid var(--tinta); cursor: pointer;
      font-family: inherit;
    }
    #btnBorrar { background: transparent; color: var(--tinta); flex: 0 0 34%; }
    #btnGuardar { background: var(--acento); color: #fff; border-color: var(--acento); }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

    #estado { margin-top: 16px; font-size: 14px; line-height: 1.5; min-height: 20px; }
    #estado.error { color: var(--alerta); font-weight: 600; }
    #estado.ok { color: var(--acento); font-weight: 600; }

    #respaldo { display: none; margin-top: 14px; }
    #respaldo a {
      display: block; text-align: center; padding: 15px; border-radius: 6px;
      background: var(--acento); color: #fff; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="caja">
    <div class="encabezado">
      <img class="logo" src="logo.png" alt="CONCRETAR ANTIOQUIA S.A.S">
      <p class="subtitulo">Registro de Mantenimiento Baños Portátiles</p>
    </div>

    <h1>Firma de quien recibe</h1>
    <p class="ayuda">Dibuja tu firma en el recuadro. Al guardarla se abre el formulario para completar los datos del mantenimiento.</p>

    <div class="lienzo">
      <canvas id="firma"></canvas>
      <div class="renglon"></div>
      <div class="pie">Firma</div>
    </div>

    <div class="botones">
      <button id="btnBorrar" type="button">Borrar</button>
      <button id="btnGuardar" type="button">Guardar y continuar</button>
    </div>

    <div id="estado"></div>
    <div id="respaldo"><a id="linkForm" href="#">Abrir el formulario</a></div>
  </div>

  <script>
    /* ====================================================================
       CONFIGURACIÓN — cambia estas dos líneas y nada más
       ==================================================================== */
    const EXEC_URL = 'https://script.google.com/macros/s/AKfycbzj9hQmH7FnRhW0eYf6t4Q8j-zDAa3wzySADdCF8VKNUqXaL1BUxCLj7-LI3zGWC28U/exec';
    const CLAVE = '1008';   // debe ser IDÉNTICA a CLAVE_API en el .gs
    /* ==================================================================== */

    // Parámetros de compresión de la firma
    const ANCHO_MAX = 600;   // ancho máximo del PNG que se envía
    const MARGEN = 8;        // margen en píxeles alrededor del trazo

    const canvas = document.getElementById('firma');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const estado = document.getElementById('estado');
    const btnGuardar = document.getElementById('btnGuardar');
    const btnBorrar = document.getElementById('btnBorrar');
    let dibujando = false, hayTrazo = false;

    function generarToken() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'f-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
    }
    const token = generarToken();

    function ajustarLienzo() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.strokeStyle = '#14181c';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    ajustarLienzo();
    // Al girar el celular el lienzo se redimensiona; solo lo hacemos si aún no hay firma
    window.addEventListener('resize', function () { if (!hayTrazo) ajustarLienzo(); });

    function posicion(e) {
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function iniciar(e) {
      dibujando = true; hayTrazo = true;
      const p = posicion(e);
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      e.preventDefault();
    }
    function mover(e) {
      if (!dibujando) return;
      const p = posicion(e);
      ctx.lineTo(p.x, p.y); ctx.stroke();
      e.preventDefault();
    }
    function terminar() { dibujando = false; }

    canvas.addEventListener('mousedown', iniciar);
    canvas.addEventListener('mousemove', mover);
    canvas.addEventListener('mouseup', terminar);
    canvas.addEventListener('mouseleave', terminar);
    canvas.addEventListener('touchstart', iniciar, { passive: false });
    canvas.addEventListener('touchmove', mover, { passive: false });
    canvas.addEventListener('touchend', terminar);

    btnBorrar.addEventListener('click', function () {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ajustarLienzo();
      hayTrazo = false;
      estado.className = ''; estado.textContent = '';
    });

    btnGuardar.addEventListener('click', guardar);


    /* ====================================================================
       COMPRESIÓN DE LA FIRMA
       Recorta el espacio vacío, reduce el ancho y deja la tinta en negro
       sobre fondo transparente. Baja el peso de ~33 KB a ~4 KB.
       ==================================================================== */

    function comprimirFirma() {
      const w = canvas.width, h = canvas.height;
      const datos = ctx.getImageData(0, 0, w, h).data;

      // Buscar los límites reales del trazo
      var x1 = w, y1 = h, x2 = 0, y2 = 0, hayPixel = false;
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          // píxel con tinta: alfa presente y oscuro
          if (datos[i + 3] > 30 && datos[i] < 200) {
            hayPixel = true;
            if (x < x1) x1 = x;
            if (x > x2) x2 = x;
            if (y < y1) y1 = y;
            if (y > y2) y2 = y;
          }
        }
      }
      if (!hayPixel) return canvas.toDataURL('image/png');

      x1 = Math.max(0, x1 - MARGEN);
      y1 = Math.max(0, y1 - MARGEN);
      x2 = Math.min(w - 1, x2 + MARGEN);
      y2 = Math.min(h - 1, y2 + MARGEN);

      const anchoRec = x2 - x1 + 1;
      const altoRec = y2 - y1 + 1;
      const escala = Math.min(1, ANCHO_MAX / anchoRec);

      const salida = document.createElement('canvas');
      salida.width = Math.round(anchoRec * escala);
      salida.height = Math.round(altoRec * escala);
      const sctx = salida.getContext('2d', { willReadFrequently: true });
      sctx.imageSmoothingQuality = 'high';
      sctx.drawImage(canvas, x1, y1, anchoRec, altoRec, 0, 0, salida.width, salida.height);

      binarizar(sctx, salida.width, salida.height);
      return salida.toDataURL('image/png');
    }

    /** Deja solo tinta negra sobre transparente: el PNG comprime mucho mejor. */
    function binarizar(contexto, ancho, alto) {
      const img = contexto.getImageData(0, 0, ancho, alto);
      const d = img.data;
      for (var i = 0; i < d.length; i += 4) {
        const luz = (d[i] + d[i + 1] + d[i + 2]) / 3;
        const tinta = d[i + 3] > 20 && luz < 190;
        if (tinta) {
          d[i] = 20; d[i + 1] = 24; d[i + 2] = 28; d[i + 3] = 255;
        } else {
          d[i + 3] = 0;   // transparente
        }
      }
      contexto.putImageData(img, 0, 0);
    }


    async function guardar() {
      if (!hayTrazo) {
        estado.className = 'error';
        estado.textContent = 'Dibuja tu firma antes de continuar.';
        return;
      }
      btnGuardar.disabled = true;
      estado.className = '';
      estado.textContent = 'Guardando firma…';

      try {
        const imagen = comprimirFirma();
        console.log('Peso aproximado de la firma: ' + Math.round(imagen.length * 0.75 / 1024) + ' KB');

        const respuesta = await fetch(EXEC_URL, {
          method: 'POST',
          credentials: 'omit',            // sin cookies: evita el conflicto de cuentas de Google
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // evita la petición previa CORS
          body: JSON.stringify({
            clave: CLAVE,
            token: token,
            imagen: imagen
          })
        });

        const datos = await respuesta.json();
        if (!datos.ok) throw new Error(datos.error || 'El servidor rechazó la firma.');

        estado.className = 'ok';
        estado.textContent = 'Firma guardada. Abriendo el formulario…';
        irAlFormulario(datos.url);

      } catch (err) {
        btnGuardar.disabled = false;
        estado.className = 'error';
        estado.textContent = 'No se pudo guardar la firma. Revisa la señal e inténtalo otra vez. (' + err.message + ')';
      }
    }

    function irAlFormulario(url) {
      const link = document.getElementById('linkForm');
      link.href = url;
      document.getElementById('respaldo').style.display = 'block';
      setTimeout(function () { window.location.href = url; }, 600);
    }
  </script>
</body>
</html>
